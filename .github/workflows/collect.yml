name: Collect NOAA OVATION
run-name: NOAA OVATION — ${{ github.event_name }}${{ inputs.predecessor_run_id && format(' (handoff from {0})', inputs.predecessor_run_id) || '' }} — ${{ github.ref_name }}

on:
  schedule:
    - cron: '2-59/5 * * * *'
  # Automatically start the collector when its implementation is deployed.
  # Data-only commits do not start new sessions.
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect*.yml'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      continue_collection:
        description: Automatically start another daily collection cycle after success
        type: boolean
        default: true
      predecessor_run_id:
        description: Source run ID supplied by automatic handoff (leave empty for manual runs)
        type: string
        default: ''
      cycle_seconds:
        description: Collection window in seconds (86370 normally; shorten only for verification)
        type: number
        default: 86370

permissions:
  contents: read

concurrency:
  group: noaa-ovation-archive
  cancel-in-progress: false

jobs:
  prepare:
    # Never spend private-repository runner minutes or publish from a feature branch.
    if: github.event.repository.private == false && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deadline: ${{ steps.plan.outputs.deadline }}
      segment_seconds: ${{ steps.plan.outputs.segment_seconds }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Test collector and publication
        run: python3 -m unittest discover -s tests -v
      - name: Plan a 23-hour 59-minute 30-second collection window
        id: plan
        env:
          CYCLE_SECONDS: ${{ inputs.cycle_seconds }}
        run: python3 scripts/cycle.py --seconds "${CYCLE_SECONDS:-86370}" >> "$GITHUB_OUTPUT"

  collect_1:
    name: Collect 1 of 5
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/collect-segment.yml
    with:
      deadline: ${{ needs.prepare.outputs.deadline }}
      seconds: ${{ fromJSON(needs.prepare.outputs.segment_seconds) }}

  collect_2:
    name: Collect 2 of 5
    needs: [prepare, collect_1]
    permissions:
      contents: write
    uses: ./.github/workflows/collect-segment.yml
    with:
      deadline: ${{ needs.prepare.outputs.deadline }}
      seconds: ${{ fromJSON(needs.prepare.outputs.segment_seconds) }}

  collect_3:
    name: Collect 3 of 5
    needs: [prepare, collect_2]
    permissions:
      contents: write
    uses: ./.github/workflows/collect-segment.yml
    with:
      deadline: ${{ needs.prepare.outputs.deadline }}
      seconds: ${{ fromJSON(needs.prepare.outputs.segment_seconds) }}

  collect_4:
    name: Collect 4 of 5
    needs: [prepare, collect_3]
    permissions:
      contents: write
    uses: ./.github/workflows/collect-segment.yml
    with:
      deadline: ${{ needs.prepare.outputs.deadline }}
      seconds: ${{ fromJSON(needs.prepare.outputs.segment_seconds) }}

  collect_5:
    name: Collect 5 of 5
    needs: [prepare, collect_4]
    permissions:
      contents: write
    uses: ./.github/workflows/collect-segment.yml
    with:
      deadline: ${{ needs.prepare.outputs.deadline }}
      seconds: ${{ fromJSON(needs.prepare.outputs.segment_seconds) }}

  handoff:
    name: Start next daily cycle automatically
    needs: collect_5
    if: github.event.repository.private == false && github.ref_name == github.event.repository.default_branch && (github.event_name != 'workflow_dispatch' || inputs.continue_collection)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # The collection job cannot dispatch workflows. This job cannot write files.
    permissions:
      actions: write
    steps:
      - name: Dispatch successor with GitHub's built-in token
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          for attempt in 1 2 3; do
            if timeout 20s gh api --method POST "repos/$REPOSITORY/actions/workflows/collect.yml/dispatches" \
              -f ref="$DEFAULT_BRANCH" -F 'inputs[continue_collection]=true' \
              -f "inputs[predecessor_run_id]=$GITHUB_RUN_ID"; then
              echo "Successor requested automatically by run $GITHUB_RUN_ID."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Could not start the next collection session. Cron remains the recovery trigger."
          exit 1
