name: Collect NOAA OVATION
run-name: NOAA OVATION — ${{ github.event_name }} — ${{ github.ref_name }}

on:
  schedule:
    - cron: '2-59/5 * * * *'
  # Automatically start the collector when its implementation is deployed.
  # Data-only commits do not start new sessions.
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noaa-ovation-archive
  cancel-in-progress: false

jobs:
  collect:
    # Never spend private-repository runner minutes or publish from a feature branch.
    if: github.event.repository.private == false && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # Six-minute debug session plus checkout and shutdown headroom.
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Test collector and publication
        run: python3 -m unittest discover -s tests -v
      - name: Collect automatically at UTC minutes 2, 7, 12, …, 57
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -u scripts/session.py --branch "$DEFAULT_BRANCH" --minutes 6
