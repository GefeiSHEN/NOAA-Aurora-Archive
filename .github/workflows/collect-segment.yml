name: OVATION collection segment

on:
  workflow_call:
    inputs:
      deadline:
        required: true
        type: string
      seconds:
        required: true
        type: number

permissions:
  contents: write

jobs:
  collect:
    if: github.event.repository.private == false && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Collect every two minutes until this segment or the cycle ends
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SEGMENT_SECONDS: ${{ inputs.seconds }}
          CYCLE_DEADLINE: ${{ inputs.deadline }}
        run: python3 -u scripts/session.py --branch "$DEFAULT_BRANCH" --seconds "$SEGMENT_SECONDS" --until "$CYCLE_DEADLINE"
