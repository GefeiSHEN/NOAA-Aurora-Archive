name: Reset OVATION data history

on:
  schedule:
    # Monthly, after the daily archiver. Does nothing until OVATION_DATA_BRANCH is set.
    - cron: '23 4 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check, bundle and verify without uploading or rewriting any branch
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Shares the archiver's group so the two never push to the data branch at the same time.
  group: noaa-ovation-archiver
  cancel-in-progress: false

jobs:
  reset:
    if: >-
      github.event.repository.private == false &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' || vars.OVATION_DATA_BRANCH != '')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Uploads the history bundle and force-pushes the data branch only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: scripts
          path: tools
      # A full, non-partial clone: the bundle must contain every object of the branch's history.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          ref: ${{ vars.OVATION_DATA_BRANCH || github.event.repository.default_branch }}
          fetch-depth: 0
          path: history
      - name: Save the history as a release bundle, then start the data branch afresh
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DATA_BRANCH: ${{ vars.OVATION_DATA_BRANCH || github.event.repository.default_branch }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        run: python3 -u tools/scripts/reset_history.py --repo history --branch "$DATA_BRANCH" --default-branch "$DEFAULT_BRANCH" $DRY_RUN
